version: '3.8'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - simple-chat-network

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/simple-chat
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - SIGNALING_URL=ws://signaling:8080
    networks:
      - simple-chat-network

  signaling:
    build:
      context: .
      dockerfile: Dockerfile.signaling
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SIGNALING_PORT=8080
    networks:
      - simple-chat-network

  coturn:
    image: instrumentisto/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_data:/var/lib/coturn
    command: -c /etc/coturn/turnserver.conf

volumes:
  mongo_data:
  coturn_data:

networks:
  simple-chat-network:
    driver: bridge

# Workflow summary
