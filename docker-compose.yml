version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - simple-chat-network

  meteor-app:
    build:
      context: .
      dockerfile: apps/meteor-app/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/simple-chat
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - SIGNALING_URL=ws://signaling-server:8080
    networks:
      - simple-chat-network

  signaling-server:
    build:
      context: .
      dockerfile: services/signaling-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SIGNALING_PORT=8080
    networks:
      - simple-chat-network

  coturn-server:
    build:
      context: .
      dockerfile: services/coturn-server/Dockerfile
    container_name: coturn-server
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    restart: unless-stopped
    networks:
      - simple-chat-network

volumes:
  mongo_data:

networks:
  simple-chat-network:
    driver: bridge

# Build instructions:
# 1. For Meteor app: meteor build --directory ../output --server-only
#    cp -r ../output/bundle ./apps/meteor-app/bundle
# 2. Run: docker-compose up --build
